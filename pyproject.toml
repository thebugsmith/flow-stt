[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-stt"
version = "0.1.0"
description = "Push-to-talk speech-to-text daemon for Wayland"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "evdev>=1.7.1",
]

# CUDA runtime libs CTranslate2 needs but does not declare; transcriber.py dlopens
# them from here, so no LD_LIBRARY_PATH is required outside systemd.
[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]

[project.scripts]
flow-stt = "flow_stt.daemon:main"

[tool.setuptools.packages.find]
where = ["src"]
